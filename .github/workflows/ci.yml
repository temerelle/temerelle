# Format, lint, types, tests, migrations and build of both projects.
# Manual only for now (Actions → CI → Run workflow); to run on every push, add `push:` and `pull_request:` below
name: CI

on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Migrations are applied to a fresh database, so a broken migration fails here, not on deploy
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: temerelle
          POSTGRES_PASSWORD: temerelle
          POSTGRES_DB: temerelle
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://temerelle:temerelle@localhost:5432/temerelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prettier --check src api
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
